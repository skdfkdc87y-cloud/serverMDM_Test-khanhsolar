
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>&#8206;</title>

    <link rel="apple-touch-icon-precomposed"
          href="http://abc.haoyunlai.xyz/favicon.ico"
          type="image/x-icon">
    <link rel="stylesheet" href="./style.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans&display=swap"
          rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            background: url("./IMG_8622.jpeg") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <p><br><br></p>

    <div class="zhengti">

        <div class="juzuo1">
            V25090035 (Kaelen Nguyen)
        </div>

        <div class="saomatishi juzhong" id="biaoti">
            将二维码对准扫描器扫码进出场
        </div>

        <div class="yuan1 yuant"></div>
        <div class="yuan2 yuant"></div>

        <div class="juzhong erweima zise">

            <div class="juzuo2" id="dateTime00"
                 style="font-weight: 500;"></div>

            <div id="neirong">
                <img class="ewm" src="./ewm.gif" alt="QR Code">
            </div>

            <div id="neirong1">
                <div>
                    <a class="juzhong footsty shuaxinerweima"
                       style="margin-top: 2rem; font-size: 2.2rem"
                       href="#">
                        刷新二维码
                    </a>
                </div>
            </div>

            <div class="juzhong footsty yishengxiao word_breath">
                <div style="display: block;">已生效</div>
            </div>

            <div class="juzhong footsty shijian">
                <div id="dateTime3">00:00</div>
            </div>

        </div>

        <div class="dierhang">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>

    </div>

    <script>
        // ========================================
        // 1. 实时显示日期和时间
        // ========================================

        function updateDateTime() {
            const now = new Date();
            const dt = document.getElementById("dateTime00");

            if (!dt) return;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            dt.textContent =
                year + "-" + month + "-" + day + " " +
                hours + ":" + minutes + ":" + seconds;
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);


        // ========================================
        // 2. Bộ đếm tự reset sau 12 tiếng
        // ========================================

        const RESET_TIME = 12 * 60 * 60 * 1000;
        const STORAGE_KEY = "startTime";

        let startTime = Number(localStorage.getItem(STORAGE_KEY));

        if (!Number.isFinite(startTime) || startTime <= 0) {
            startTime = Date.now();
            localStorage.setItem(STORAGE_KEY, String(startTime));
        }

        function updateTimer() {
            const now = Date.now();
            let elapsed = now - startTime;

            // Chỉ tự động reset khi đủ 12 tiếng
            if (elapsed >= RESET_TIME) {
                startTime = now;
                localStorage.setItem(STORAGE_KEY, String(startTime));
                elapsed = 0;
            }

            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const timer = document.getElementById("dateTime3");

            if (timer) {
                timer.textContent =
                    String(hours).padStart(2, "0") + ":" +
                    String(minutes).padStart(2, "0");
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);


        // ========================================
        // 3. Nhấn nút QR 3 lần trong 5 giây để reset thủ công
        // ========================================

        let clickTimestamps = [];

        const reloadLink = document.querySelector(".shuaxinerweima");

        if (reloadLink) {
            reloadLink.addEventListener("click", function (event) {
                event.preventDefault();

                const now = Date.now();

                clickTimestamps = clickTimestamps.filter(function (timestamp) {
                    return now - timestamp < 5000;
                });

                clickTimestamps.push(now);

                if (clickTimestamps.length >= 3) {
                    startTime = Date.now();

                    localStorage.setItem(
                        STORAGE_KEY,
                        String(startTime)
                    );

                    clickTimestamps = [];
                    updateTimer();
                }
            });
        }


        // ========================================
        // 4. Đăng ký Service Worker
        // ========================================

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("./sw.js")
                    .catch(function (error) {
                        console.error(
                            "Service Worker registration failed:",
                            error
                        );
                    });
            });
        }
    </script>

</body>
</html>
